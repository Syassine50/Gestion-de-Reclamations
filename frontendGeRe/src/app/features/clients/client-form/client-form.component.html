<form (ngSubmit)="onSubmit()" #form="ngForm">
    <mat-form-field class="full-width">
      <mat-label>Name</mat-label>
      <input matInput required [(ngModel)]="client.nom" name="nom" />
    </mat-form-field>
  
    <mat-form-field class="full-width">
      <mat-label>Email</mat-label>
      <input matInput required [(ngModel)]="client.email" name="email" />
    </mat-form-field>
  
    <mat-form-field class="full-width">
      <mat-label>Telephone</mat-label>
      <input matInput required [(ngModel)]="client.telephone" name="telephone" />
    </mat-form-field>
  
    <button mat-raised-button color="primary" type="submit">Save</button>
  </form>
