<form (ngSubmit)="onSubmit()" #form="ngForm">
    <mat-form-field class="full-width">
      <mat-label>Product</mat-label>
      <input matInput required [(ngModel)]="reclamation.produit" name="produit" />
    </mat-form-field>
  
    <mat-form-field class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput required [(ngModel)]="reclamation.description" name="description"></textarea>
    </mat-form-field>
  
    <mat-form-field class="full-width">
      <mat-label>Status</mat-label>
      <mat-select [(ngModel)]="reclamation.statut" name="statut">
        <mat-option value="Pending">Pending</mat-option>
        <mat-option value="Resolved">Resolved</mat-option>
        <mat-option value="Rejected">Rejected</mat-option>
      </mat-select>
    </mat-form-field>
  
    <mat-form-field class="full-width">
      <mat-label>Rating</mat-label>
      <input type="number" matInput [(ngModel)]="reclamation.note" name="note" />
    </mat-form-field>
  
    <mat-form-field class="full-width">
      <mat-label>Client ID</mat-label>
      <input type="number" matInput [(ngModel)]="reclamation.clientId" name="clientId" />
    </mat-form-field>
  
    <button mat-raised-button color="primary" type="submit">Save</button>
  </form>
