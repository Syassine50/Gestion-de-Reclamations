<mat-toolbar color="accent">Agents</mat-toolbar>

<mat-card>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Search</mat-label>
    <input matInput [(ngModel)]="search" (input)="applyFilter()" placeholder="Search by name or competence" />
  </mat-form-field>

  <table mat-table [dataSource]="filteredAgents" class="mat-elevation-z8" *ngIf="filteredAgents.length">

    <ng-container matColumnDef="nom">
      <th mat-header-cell *matHeaderCellDef>Last Name</th>
      <td mat-cell *matCellDef="let agent">{{ agent.nom }}</td>
    </ng-container>

    <ng-container matColumnDef="prenom">
      <th mat-header-cell *matHeaderCellDef>First Name</th>
      <td mat-cell *matCellDef="let agent">{{ agent.prenom }}</td>
    </ng-container>

    <ng-container matColumnDef="competence">
      <th mat-header-cell *matHeaderCellDef>Competence</th>
      <td mat-cell *matCellDef="let agent">{{ agent.competence }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let agent">
        <button mat-icon-button color="primary"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="deleteAgent(agent.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <p *ngIf="!filteredAgents.length" class="no-data">No agents found.</p>
</mat-card>
