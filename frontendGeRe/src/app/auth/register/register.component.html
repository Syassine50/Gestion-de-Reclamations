<form (ngSubmit)="onSubmit()" [formGroup]="registerForm">
    <div *ngIf="message" class="success">{{ message }}</div>
    <div *ngIf="error" class="error">{{ error }}</div>
  
    <input formControlName="username" placeholder="Username" required />
    <input formControlName="password" type="password" placeholder="Password" required />
  
    <select formControlName="role" (change)="onRoleChange()">
      <option value="ROLE_CLIENT">Client</option>
      <option value="ROLE_AGENT">Agent</option>
    </select>
  
    <div *ngIf="isClient">
      <input formControlName="email" placeholder="Email" />
      <input formControlName="telephone" placeholder="Telephone" />
    </div>
  
    <div *ngIf="isAgent">
      <input formControlName="competence" placeholder="Competence" />
    </div>
  
    <button type="submit">Register</button>
  </form>
